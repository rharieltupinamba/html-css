<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        /*  SELETORES PERSONALIZADOS
            # = id
            . = class
            : = pseudo-class
            :: = pseudo-element
            > = children
        */

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: rgb(48, 6, 87);
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: rgb(68, 0, 0);
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }

        a:active {
            color: yellow;
        }

        a::after {
            content: '[☪]';
            text-decoration: none;
            font-weight: normal;
            color: rgb(130, 0, 216);
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://www.instagram.com/milhoondas/" target="_blank">Meu Instagram</a></li>
        <li><a href="https://x.com/sacodedoritos?t=tHlddzGlkOV6fT89TDEApQ&s=09&fbclid=PAZXh0bgNhZW0CMTEAAafPtALLpgVca1tiHZgZEadFIBvLQnN0JRhS5695YkE9h642HLwFK5iRbLsFtA_aem_VA3nGixoVghV9aJWVny7dw" target="_blank">Meu Twitter</a></li>
        <li><a href="https://github.com/Milhoondas" target="_blank">Meu GitHub</a></li>
    </ul>
</body>
</html>
