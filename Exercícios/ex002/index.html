<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linha</h1>
    <hr>
    <p>Você pode escrever um parágrafo de qualquer jeito. 
        <hr>Basta colocar tudo <br> dentro das tags</p>
    &lt;p&gt;Parágrafo novo, olha aqui!</p> <!-- CARLINHOS 2050 -->
    <P>Vamos adicionar símbolos:
        &reg;
        &copy;
        &trade;
        &euro;
        &pound;
        &cent;
        &yen;
        &delta;
        &Delta;
        &uparrow;
        &uarr;
    </P>
    <p>Vamos adicionar emojis:
        &#x1F596; &#x1f480;
    </p>
</body>
</html>
